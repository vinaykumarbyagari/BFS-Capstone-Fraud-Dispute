<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Audit trail')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid px-4">
    <h2>Append-only audit trail</h2>
    <p class="text-muted">Most recent 100 events. Records cannot be modified or deleted.</p>
    <div class="card">
        <table class="table table-sm mb-0">
            <thead><tr><th>Time</th><th>Case</th><th>Actor</th><th>Event</th><th>Details</th></tr></thead>
            <tbody>
            <tr th:each="e : ${events}">
                <td class="mono" th:text="${#temporals.format(e.createdAt, 'MM-dd HH:mm:ss')}"></td>
                <td class="mono"><a th:if="${e.caseId != null}" th:href="@{/cases/{id}(id=${e.caseId})}"
                                    th:text="${e.caseId.substring(0,8)}"></a></td>
                <td th:text="${e.actor}"></td>
                <td><span class="badge text-bg-light border" th:text="${e.eventType}"></span></td>
                <td class="mono" th:text="${e.detailsJson}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
