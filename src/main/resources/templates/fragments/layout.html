<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Fraud Dispute Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; }
        pre.json { background:#f6f8fa; border:1px solid #dee2e6; border-radius:.375rem; padding:.75rem;
                   white-space:pre-wrap; word-break:break-word; font-size:.8rem; }
        .score-bar { height: 6px; }
    </style>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Fraud Dispute Agent</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Cases</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cases/new}">New Dispute</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/policies}">Policies</a></li>
                <li class="nav-item" sec:authorize="hasRole('REVIEWER')">
                    <a class="nav-link" th:href="@{/audit}">Audit Trail</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}">Sign in</a>
                </li>
                <li class="nav-item d-flex align-items-center" sec:authorize="isAuthenticated()">
                    <span class="navbar-text me-3" sec:authentication="name"></span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button class="btn btn-outline-light btn-sm" type="submit">Sign out</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
